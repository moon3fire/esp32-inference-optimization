name: Host correctness checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python tests/check_artifacts.py
      - run: python tests/run_kernel_test.py
